<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA Trading Dashboard v5.0</title>
  
  <!-- TailwindCSS via Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { bg: '#0a0e27', card: '#1a1f36', border: '#2d3748', hover: '#374151' }
          }
        }
      }
    }
  </script>
  
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1f36; }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }
  </style>
</head>

<body class="bg-dark-bg text-gray-100" x-data="dashboard()" x-init="init()">
  <!-- Nav -->
  <nav class="bg-dark-card border-b border-dark-border sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
        📊 EA Dashboard <span class="text-xs text-gray-500">v5.0</span>
      </h1>
      <div class="flex items-center space-x-3">
        <div class="text-sm text-gray-400 flex items-center space-x-2">
          <div class="w-2 h-2 rounded-full" :class="loading ? 'bg-yellow-500 animate-pulse' : 'bg-green-500'"></div>
          <span x-text="loading ? 'Loading...' : 'Live'"></span>
        </div>
        <a href="/docs" class="text-gray-400 hover:text-blue-400 text-sm">API</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- KPIs -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
        <div class="text-sm text-gray-400 mb-2">Balance</div>
        <div class="text-2xl font-bold" x-text="fmt(summary.total_balance)"></div>
      </div>
      <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
        <div class="text-sm text-gray-400 mb-2">Profit</div>
        <div class="text-2xl font-bold" :class="summary.total_profit >= 0 ? 'text-green-400' : 'text-red-400'" 
             x-text="fmt(summary.total_profit)"></div>
      </div>
      <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
        <div class="text-sm text-gray-400 mb-2">Accounts</div>
        <div class="text-2xl font-bold" x-text="summary.total_accounts"></div>
      </div>
      <div class="bg-dark-card rounded-xl p-6 border border-dark-border">
        <div class="text-sm text-gray-400 mb-2">Trades</div>
        <div class="text-2xl font-bold" x-text="summary.total_trades"></div>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
      <button @click="filter = 'all'" :class="filter === 'all' ? 'bg-blue-500 text-white' : 'bg-dark-card text-gray-400'" 
              class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">Alle</button>
      <button @click="filter = 'live'" :class="filter === 'live' ? 'bg-green-500 text-white' : 'bg-dark-card text-gray-400'" 
              class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">🟢 Live</button>
      <button @click="filter = 'copy'" :class="filter === 'copy' ? 'bg-blue-500 text-white' : 'bg-dark-card text-gray-400'" 
              class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">🔵 Copy</button>
      <button @click="filter = 'demo'" :class="filter === 'demo' ? 'bg-orange-500 text-white' : 'bg-dark-card text-gray-400'" 
              class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">🟠 Demo</button>
    </div>

    <!-- Accounts Grid -->
    <div class="grid gap-4 lg:grid-cols-2 xl:grid-cols-3">
      <template x-for="acc in filtered" :key="acc.id">
        <div class="bg-dark-card rounded-xl p-6 border border-dark-border hover:border-blue-500/50 transition cursor-pointer">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 class="text-lg font-semibold" x-text="acc.name"></h3>
              <div class="flex items-center space-x-2 mt-1">
                <span class="text-xs text-gray-500" x-text="'#' + acc.account_number"></span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-dark-bg uppercase" 
                      :class="{'text-green-400': acc.category === 'live', 'text-blue-400': acc.category === 'copy', 'text-orange-400': acc.category === 'demo'}"
                      x-text="acc.category"></span>
              </div>
            </div>
            <div class="flex items-center space-x-1">
              <div class="w-2 h-2 rounded-full" :class="acc.is_online ? 'bg-green-500' : 'bg-red-500'"></div>
              <span class="text-xs text-gray-500" x-text="acc.is_online ? 'On' : 'Off'"></span>
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div>
              <div class="text-gray-500 text-xs">Balance</div>
              <div class="font-semibold" x-text="fmt(acc.current_balance, acc.currency)"></div>
            </div>
            <div>
              <div class="text-gray-500 text-xs">Profit</div>
              <div class="font-semibold" :class="(acc.total_profit || 0) >= 0 ? 'text-green-400' : 'text-red-400'" 
                   x-text="fmt(acc.total_profit, acc.currency)"></div>
            </div>
            <div>
              <div class="text-gray-500 text-xs">Gain</div>
              <div :class="(acc.gain_percent || 0) >= 0 ? 'text-green-400' : 'text-red-400'" 
                   x-text="(acc.gain_percent || 0).toFixed(2) + '%'"></div>
            </div>
            <div>
              <div class="text-gray-500 text-xs">Trades</div>
              <div x-text="acc.total_trades || 0"></div>
            </div>
          </div>
          
          <div class="mt-4 pt-4 border-t border-dark-border text-xs text-gray-500 flex justify-between">
            <span x-text="'Win: ' + (acc.win_rate || 0).toFixed(1) + '%'"></span>
            <span x-text="acc.start_date ? new Date(acc.start_date).toLocaleDateString('de-DE') : (acc.days_running + 'd')"></span>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty State -->
    <div x-show="filtered.length === 0" x-cloak class="text-center py-16 bg-dark-card rounded-xl border border-dark-border">
      <h3 class="text-lg text-gray-400">Keine Accounts</h3>
      <p class="text-sm text-gray-500 mt-2">Sende einen Webhook von MT4/MT5</p>
    </div>
  </main>

  <script>
    function dashboard() {
      return {
        loading: false,
        filter: 'all',
        accounts: [],
        summary: { total_balance: 0, total_profit: 0, total_accounts: 0, total_trades: 0 },
        
        get filtered() {
          return this.filter === 'all' ? this.accounts : this.accounts.filter(a => a.category === this.filter);
        },
        
        async init() {
          await this.load();
          setInterval(() => this.load(), 10000);
        },
        
        async load() {
          this.loading = true;
          try {
            const [sum, accs] = await Promise.all([
              fetch('/api/analytics/summary').then(r => r.json()),
              fetch('/api/accounts').then(r => r.json())
            ]);
            if (sum.success) this.summary = sum;
            if (accs.success) this.accounts = accs.accounts;
          } catch (e) {
            console.error(e);
          } finally {
            this.loading = false;
          }
        },
        
        fmt(v, c = 'USD') {
          return v == null ? '–' : new Intl.NumberFormat('de-DE', { style: 'currency', currency: c }).format(v);
        }
      }
    }
  </script>
</body>
</html>
